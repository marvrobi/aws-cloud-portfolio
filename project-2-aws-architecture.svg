<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320"><title>Project 2 AWS architecture</title><desc>Public HTTPS delivery through CloudFront to private S3, and Internet through Static IP to Lightsail WordPress with CPU monitoring and tested manual snapshot recovery.</desc><rect width="1800" height="1320" fill="#F3F6FA"/><rect x="0" y="0" width="1800" height="155" rx="0" fill="#15263D" stroke="none" stroke-width="2"/><text x="65" y="47" font-family="Segoe UI, sans-serif" font-size="19" font-weight="700" fill="#A9C9F4">PROJECT #2  /  AWS ARCHITECTURE</text><text x="65" y="108" font-family="Segoe UI, sans-serif" font-size="43" font-weight="700" fill="#FFFFFF">Secure delivery &amp; tested manual recovery</text><text x="65" y="189" font-family="Segoe UI, sans-serif" font-size="23" font-weight="400" fill="#52647A">Two service flows share the public Internet entry point.</text><rect x="380" y="224" width="1355" height="254" rx="22" fill="#E8F0FA" stroke="none" stroke-width="2"/><rect x="380" y="500" width="1355" height="282" rx="22" fill="#EDF0FA" stroke="none" stroke-width="2"/><text x="415" y="263" font-family="Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#245E9B">01  PUBLIC CONTENT DELIVERY</text><text x="415" y="539" font-family="Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#6152A0">02  LIGHTSAIL / WORDPRESS</text><rect x="65" y="404" width="250" height="145" rx="18" fill="#FFFFFF" stroke="#D7E0EB" stroke-width="2"/><rect x="83" y="426" width="6" height="101" rx="3" fill="#245E9B" stroke="none" stroke-width="2"/><text x="105" y="452" font-family="Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#253449">User / Internet</text><text x="105" y="492" font-family="Segoe UI, sans-serif" font-size="23" font-weight="400" fill="#253449">Public access</text><polyline points="315,476 350,476 350,362 420,362" fill="none" stroke="#245E9B" stroke-width="3"/><polygon points="420,362 408.5914266954251,368.2325320018546 408.5914266954251,355.7674679981454" fill="#245E9B"/><polyline points="350,476 350,636 420,636" fill="none" stroke="#6152A0" stroke-width="3"/><polygon points="420,636 408.5914266954251,642.2325320018547 408.5914266954251,629.7674679981453" fill="#6152A0"/><rect x="420" y="299" width="230" height="128" rx="18" fill="#FFFFFF" stroke="#D7E0EB" stroke-width="2"/><rect x="438" y="321" width="6" height="84" rx="3" fill="#245E9B" stroke="none" stroke-width="2"/><text x="460" y="347" font-family="Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#253449">HTTPS</text><text x="460" y="387" font-family="Segoe UI, sans-serif" font-size="23" font-weight="400" fill="#253449">In transit</text><polyline points="650,363 740,363" fill="none" stroke="#245E9B" stroke-width="3"/><polygon points="740,363 728.5914266954252,369.2325320018546 728.5914266954252,356.7674679981454" fill="#245E9B"/><rect x="740" y="299" width="330" height="128" rx="18" fill="#FFFFFF" stroke="#D7E0EB" stroke-width="2"/><rect x="758" y="321" width="6" height="84" rx="3" fill="#245E9B" stroke="none" stroke-width="2"/><text x="780" y="347" font-family="Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#253449">CloudFront</text><text x="780" y="387" font-family="Segoe UI, sans-serif" font-size="23" font-weight="400" fill="#253449">Content caching</text><polyline points="1070,363 1170,363" fill="none" stroke="#245E9B" stroke-width="3"/><polygon points="1170,363 1158.591426695425,369.2325320018546 1158.591426695425,356.7674679981454" fill="#245E9B"/><text x="1080" y="338" font-family="Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#52647A">Origin</text><rect x="1170" y="284" width="520" height="164" rx="18" fill="#FFFFFF" stroke="#D7E0EB" stroke-width="2"/><rect x="1188" y="306" width="6" height="120" rx="3" fill="#338B70" stroke="none" stroke-width="2"/><text x="1210" y="332" font-family="Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#253449">Private S3 origin</text><text x="1210" y="372" font-family="Segoe UI, sans-serif" font-size="23" font-weight="400" fill="#253449">Block Public Access enabled</text><text x="1210" y="404" font-family="Segoe UI, sans-serif" font-size="23" font-weight="400" fill="#253449">SSE-S3 encryption at rest</text><rect x="420" y="568" width="285" height="136" rx="18" fill="#FFFFFF" stroke="#D7E0EB" stroke-width="2"/><rect x="438" y="590" width="6" height="92" rx="3" fill="#6152A0" stroke="none" stroke-width="2"/><text x="460" y="616" font-family="Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#253449">Static IP</text><text x="460" y="656" font-family="Segoe UI, sans-serif" font-size="23" font-weight="400" fill="#253449">Public endpoint</text><polyline points="705,636 790,636" fill="none" stroke="#6152A0" stroke-width="3"/><polygon points="790,636 778.5914266954252,642.2325320018547 778.5914266954252,629.7674679981453" fill="#6152A0"/><rect x="790" y="568" width="420" height="136" rx="18" fill="#FFFFFF" stroke="#D7E0EB" stroke-width="2"/><rect x="808" y="590" width="6" height="92" rx="3" fill="#6152A0" stroke="none" stroke-width="2"/><text x="830" y="616" font-family="Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#253449">Lightsail WordPress</text><text x="830" y="656" font-family="Segoe UI, sans-serif" font-size="23" font-weight="400" fill="#253449">Application workload</text><polyline points="1210,636 1300,636" fill="none" stroke="#6152A0" stroke-width="3" stroke-dasharray="10 8"/><polygon points="1300,636 1288.591426695425,642.2325320018547 1288.591426695425,629.7674679981453" fill="#6152A0"/><text x="1225" y="609" font-family="Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#52647A">CPU</text><rect x="1300" y="568" width="390" height="136" rx="18" fill="#FFFFFF" stroke="#D7E0EB" stroke-width="2"/><rect x="1318" y="590" width="6" height="92" rx="3" fill="#6152A0" stroke="none" stroke-width="2"/><text x="1340" y="616" font-family="Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#253449">CloudWatch alarm</text><text x="1340" y="656" font-family="Segoe UI, sans-serif" font-size="23" font-weight="400" fill="#253449">CPU utilization monitoring</text><text x="420" y="749" font-family="Segoe UI, sans-serif" font-size="22" font-weight="400" fill="#435771">Monitoring: CPU utilization alarm</text><polyline points="1000,704 1000,804 195,804 195,905" fill="none" stroke="#B2762F" stroke-width="3" stroke-dasharray="10 8"/><polygon points="195,905 188.76746799814535,893.5914266954252 201.23253200185465,893.5914266954252" fill="#B2762F"/><rect x="65" y="835" width="1670" height="298" rx="18" fill="#FFFFFF" stroke="#D7E0EB" stroke-width="2"/><text x="95" y="877" font-family="Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#9C651F">03  BACKUP → MANUAL RECOVERY / FAILOVER</text><rect x="95" y="914" width="300" height="133" rx="14" fill="#FFF8ED" stroke="#E8D9C4" stroke-width="2"/><text x="113" y="946" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#9C651F">01</text><text x="113" y="983" font-family="Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#253449">Lightsail snapshot</text><text x="113" y="1019" font-family="Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#253449">Backup created</text><polyline points="395,980 425,980" fill="none" stroke="#B2762F" stroke-width="3"/><polygon points="425,980 413.5914266954251,986.2325320018547 413.5914266954251,973.7674679981453" fill="#B2762F"/><rect x="425" y="914" width="300" height="133" rx="14" fill="#FFF8ED" stroke="#E8D9C4" stroke-width="2"/><text x="443" y="946" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#9C651F">02</text><text x="443" y="983" font-family="Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#253449">Replacement Lightsail</text><text x="443" y="1019" font-family="Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#253449">Restore instance from snapshot</text><polyline points="725,980 755,980" fill="none" stroke="#B2762F" stroke-width="3"/><polygon points="755,980 743.5914266954252,986.2325320018547 743.5914266954252,973.7674679981453" fill="#B2762F"/><rect x="755" y="914" width="300" height="133" rx="14" fill="#FFF8ED" stroke="#E8D9C4" stroke-width="2"/><text x="773" y="946" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#9C651F">03</text><text x="773" y="983" font-family="Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#253449">Restore validation</text><text x="773" y="1019" font-family="Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#253449">Confirm restored workload</text><polyline points="1055,980 1085,980" fill="none" stroke="#B2762F" stroke-width="3"/><polygon points="1085,980 1073.591426695425,986.2325320018547 1073.591426695425,973.7674679981453" fill="#B2762F"/><rect x="1085" y="914" width="300" height="133" rx="14" fill="#FFF8ED" stroke="#E8D9C4" stroke-width="2"/><text x="1103" y="946" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#9C651F">04</text><text x="1103" y="983" font-family="Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#253449">Static IP reassignment</text><text x="1103" y="1019" font-family="Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#253449">Manually switch endpoint</text><polyline points="1385,980 1415,980" fill="none" stroke="#B2762F" stroke-width="3"/><polygon points="1415,980 1403.591426695425,986.2325320018547 1403.591426695425,973.7674679981453" fill="#B2762F"/><rect x="1415" y="914" width="300" height="133" rx="14" fill="#FFF8ED" stroke="#E8D9C4" stroke-width="2"/><text x="1433" y="946" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#9C651F">05</text><text x="1433" y="983" font-family="Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#253449">Service verification</text><text x="1433" y="1019" font-family="Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#253449">Confirm service works</text><text x="95" y="1095" font-family="Segoe UI, sans-serif" font-size="22" font-weight="400" fill="#52647A">Tested manual recovery; automatic Multi-AZ failover and zero-downtime recovery were not demonstrated.</text><rect x="65" y="1155" width="1670" height="82" rx="16" fill="#E4EEE9" stroke="none" stroke-width="2"/><text x="95" y="1191" font-family="Segoe UI, sans-serif" font-size="19" font-weight="700" fill="#277159">COST CONTROL</text><text x="320" y="1199" font-family="Segoe UI, sans-serif" font-size="23" font-weight="400" fill="#253449">Temporary recovery instance removed after validation to avoid ongoing charges.</text><text x="65" y="1275" font-family="Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#52647A">Scope: conversation facts only. Origin access mechanism, region, alarm threshold and recovery timing are unspecified.</text><text x="65" y="1304" font-family="Segoe UI, sans-serif" font-size="18" font-weight="400" fill="#52647A">Solid arrows: delivery path     •     Dashed arrows: monitoring / backup relationship</text></svg>